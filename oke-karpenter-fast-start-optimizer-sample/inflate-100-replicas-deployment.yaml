apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate-100-replicas
  labels:
    app: inflate-100-replicas
spec:
  replicas: 100
  selector:
    matchLabels:
      app: inflate-100-replicas
  template:
    metadata:
      labels:
        app: inflate-100-replicas
    spec:
      nodeSelector:
        oke-optimization.oracle.com/profile: fast-start
      tolerations:
        - key: oke-optimization.oracle.com/scaling-test
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
